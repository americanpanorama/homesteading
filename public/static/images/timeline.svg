<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -10 162 50" role="img" aria-labelledby="title desc">
  <title id="title">Timeline cells</title>
  <desc id="desc">Each row in the timeline represents a different place, each cell a particular fiscal year.</desc>
  <line x1="90" y1="-10" x2="90" y2="40" stroke="#888" stroke-width="3.5" vector-effect="non-scaling-stroke" />
  <text x="10" y="22" font-family="sans-serif" fill="#444">NM</text>
  <rect x="40" y="0" width="20" height="30" fill="rgb(255, 183, 167)" stroke="#6E6570" stroke-width="1" vector-effect="non-scaling-stroke" />
  <rect x="60" y="0" width="20" height="30" fill="rgb(255, 218, 203)" stroke="#6E6570" stroke-width="1" vector-effect="non-scaling-stroke" />
  <rect x="80" y="0" width="20" height="30" fill="rgb(255, 142, 127)" stroke="#6E6570" stroke-width="1" vector-effect="non-scaling-stroke" />
  <rect x="100" y="0" width="20" height="30" fill="#BF1657" stroke="#6E6570" stroke-width="1" vector-effect="non-scaling-stroke" />
  <rect x="120" y="0" width="20" height="30" fill="rgb(255, 183, 167)" stroke="#6E6570" stroke-width="1" vector-effect="non-scaling-stroke" />
  <rect x="140" y="0" width="20" height="30" fill="rgb(255, 218, 203)" stroke="#6E6570" stroke-width="1" vector-effect="non-scaling-stroke" />
</svg>
